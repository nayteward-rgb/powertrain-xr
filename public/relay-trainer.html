display:inline-block;border:1px solid #3b5f7f;border-radius:999px;padding:4px 7px;color:var(--a);font-size:10px}.body h2{margin:9px 0 6px}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel{padding:clamp(17px,3vw,26px)}.head{display:flex;justify-content:space-between;gap:12px}.head h1{font-size:clamp(32px,6vw,52px)}.q{border:1px solid var(--l);border-radius:11px;padding:14px;background:#0d1f32;margin-top:11px}.q h3{line-height:1.4}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{display:flex;gap:8px;text-align:left;border:1px solid #355775;border-radius:9px;padding:10px;background:#142b43;color:#fff}.opt.sel{border-color:var(--a);background:#174042}.letter{width:24px;height:24px;border-radius:6px;background:#294b68;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900}.submit{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.submit span{color:var(--m)}button:disabled{opacity:.4}.result{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center}.ring{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--a) var(--ang),#29445e 0);position:relative}.ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0d1e30}.ring b{z-index:1;font-size:32px}.review{margin-top:15px}.answer{border:1px solid var(--l);border-left:5px solid var(--g);border-radius:9px;padding:12px;background:#0d1f32;margin-top:9px}.answer.bad{border-left-color:var(--r)}.answer p{margin:4px 0;font-size:13px}.hist{display:grid;gap:9px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--l);border-radius:10px;padding:13px;background:#0d2034}.item h3{margin:0}.score{text-align:right;font-size:24px;font-weight:900}.empty{text-align:center;padding:30px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.hero,.grid,.result{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.head{ </style></head><body><header class="top"><div class="brand"><div class="logo">XR</div><div><b>POWERTRAIN XR</b><small>Interactive 869 Relay Trainer</small></div></div><a class="btn" href="/">Home</a></header><nav class="nav"><button class="on" data-view="library">Scenarios</button><button data-view="history">History</button><button data-view="summary">Summary</button></nav><main id="app"><section class="panel"><p class="ey">Trainer loading</p><h1>Interactive 869 Relay Trainer</h1><p>If this message remains, reload the page once.</p></section></main><noscript><main><section class="panel"><h1>JavaScript is required</h1><p>Open this page in Safari or Chrome.</p></section></main></noscript><script>
(function(){"use strict";var key="ptxr869-v1",attempts=load(),current=null,answers=[],last=null,app=document.getElementById("app");var scenarios=[
{id:"gf",code:"50G/51G",cat:"Protection",title:"Ground-Fault Trip",desc:"Interpret a ground-fault target and choose the safe response.",obj:"Recognize residual-current protection and investigate before reset.",dev:"GF",q:[{t:"An active 50G target most directly indicates:",o:["A phase-to-ground or residual-current condition","Normal motor-start current","Low battery voltage","Successful synchronization"],a:0,e:"50G is an instantaneous ground-fault function in this training example."},{t:"The best first action after a ground-fault trip is:",o:["Reset and reclose immediately","Identify the equipment and investigate the cause","Raise the pickup setting","Bypass the trip output"],a:1,e:"Protection trips should be investigated before restoration."},{t:"The most relevant quantity for ground-fault detection is:",o:["Residual or zero-sequence current","Room temperature","Valve position","Shaft speed only"],a:0,e:"Residual current identifies current returning through an unintended path."}]},
{id:"oc",code:"50P/51P",cat:"Protection",title:"Phase Overcurrent",desc:"Distinguish instantaneous and time-overcurrent operation.",obj:"Use targets and event context to understand overcurrent operation.",dev:"OC",q:[{t:"Which element normally responds fastest to a severe phase fault?",o:["51P time overcurrent","50P instantaneous overcurrent","49 thermal model","27 undervoltage"],a:1,e:"50P is the instantaneous phase-overcurrent element."},{t:"A 51P target usually means:",o:["Current remained above pickup for a time delay","Ground current only","Normal zero current","A communication alarm"],a:0,e:"51P follows a time-current characteristic."},{t:"Before resetting the trip, check:",o:["The cause and equipment condition","Only display brightness","Nothing","The training filter"],a:0,e:"Do not reset protection blindly."}]},
{id:"thermal",code:"49",cat:"Protection",title:"Motor Thermal Overload",desc:"Work through a thermal-model trip and restart delay.",obj:"Connect sustained current and repeated starts to motor heating.",dev:"49",q:[{t:"The 49 element primarily protects against:",o:["Accumulated motor heating","Instantaneous ground current only","Network loss","Incorrect date"],a:0,e:"The thermal model estimates accumulated heating."},{t:"Why might an immediate restart be blocked?",o:["The motor needs thermal recovery","The relay forgot a password","The CT ratio changed","The breaker is always defective"],a:0,e:"Restarting too soon adds heat to a hot motor."},{t:"What can contribute to thermal overload?",o:["Repeated starts or sustained high current","A clean display","Correct phase rotation","A closed door only"],a:0,e:"Starts and sustained current both increase heating."}]},
{id:"perm",code:"START PERM",cat:"Control",title:"Start Permissive Logic",desc:"Trace why a valid start command is rejected.",obj:"Check breaker, protection, mode, auxiliary, and process permissives.",dev:"PERM",q:[{t:"A start command is rejected. Check first:",o:["Which permissive is not satisfied","Replace the motor","Raise relay settings","Ignore the interlock"],a:0,e:"The blocking permissive identifies the missing condition."},{t:"A reasonable start permissive is:",o:["Breaker available and no lockout","An active trip target","An applied LOTO lock","Control power removed"],a:0,e:"The system must be available, healthy, and not isolated."},{t:"Why should permissives not be bypassed?",o:["They prevent unsafe or damaging operation","They only change color","They set the clock","They improve Wi-Fi"],a:0,e:"Permissives enforce required operating conditions."}]},

];function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function load(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}function save(){try{localStorage.setItem(key,JSON.stringify(attempts))}catch(e){}}function nav(v){document.querySelectorAll("[data-view]").forEach(function(b){b.classList.toggle("on",b.dataset.view===v)});if(v==="library")library();if(v==="history")history();if(v==="summary")summary();scrollTo(0,0)}function best(id){var s=attempts.filter(function(a){return a.sid===id}).map(function(a){return a.score});return s.length?Math.max.apply(null,s):null}function diag(s){return'<div class="relay"><b>'+esc(s.dev)+'</b><small>869 TRAINING RELAY</small></div>'}function library(){app.innerHTML='<section class="hero"><div><p class="ey">Fictional training values only</p><h1>Interactive 869 Relay Trainer</h1><p>Practice protection logic, start permissives, trip outputs, and recovery decisions.</p></div><div class="warn"><b>Training simulation</b><p>Not a settings source, switching order, or field procedure.</p></div></section><section class="grid">'+scenarios.map(function(s){var b=best(s.id);return'<article class="card"><div class="diag">'+diag(s)+'</div><div class="body"><span class="tag">'+esc(s.code)+'</span><h2>'+esc(s.title)+'</h2><p>'+esc(s.desc)+'</p><div class="foot"><span>'+(b===null?'Not attempted':'Best '+b+'%')+'</span><button class="btn primary" data-start="'+s.id+'">Start</button></div></div></article>'}).join('')+'</section>'}function start(id){current=scenarios.filter(function(s){return s.id===id})[0];answers=[];scenario()}function scenario(){app.innerHTML='<section class="panel"><div class="head"><div><p class="ey">'+esc(current.code)+' · '+esc(current.cat)+'</p><h1>'+esc(current.title)+'</h1><p>'+esc(current.obj)+'</p></div><button class="btn" data-view="library">← Library</button></div>'+current.q.map(function(q,i){return'<article class="q"><span class="ey">Question '+(i+1)+' of '+current.q.length+'</span><h3>'+esc(q.t)+'</h3><div class="opts">'+q.o.map(function(o,j){return'<button class="opt '+(answers[i]===j?'sel':'')+'" data-q="'+i+'" data-o="'+j+'"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div></article>'}).join('')+'<div class="submit"><span>'+answers.filter(function(x){return typeof x==="number"}).length+' of '+current.q.length+' answered</span><button class="btn primary" id="submit" '+(answers.filter(function(x){return typeof x==="number"}).length===current.q.length?'':'disabled')+'>Submit attempt</button></div></section>';scrollTo(0,0)}function submit(){var details=current.q.map(function(q,i){return{t:q.t,sel:q.o[answers[i]],right:q.o[q.a],ok:answers[i]===q.a,e:q.e}}),correct=details.filter(function(d){return d.ok}).length,score=Math.round(correct/details.length*100);last={id:"a"+Date.now(),sid:current.id,title:current.title,cat:current.cat,time:new Date().toISOString(),score:score,correct:correct,incorrect:details.length-correct,details:details};attempts.unshift(last);save();result()}function result(){app.innerHTML='<section class="panel"><div class="result"><div class="ring" style="--ang:'+(last.score*3.6)+'deg"><b>'+last.score+'%</b></div><div><p class="ey">Attempt complete</p><h1>'+(last.score>=75?'Scenario passed':'Review and retry')+'</h1><p>'+esc(last.title)+' · '+last.correct+' correct, '+last.incorrect+' incorrect.</p><div class="actions"><button class="btn primary" data-retry="'+last.sid+'">Run again</button><button class="btn" data-view="history">History</button><button class="btn" data-view="library">Library</button></div></div></div><section class="review">'+last.details.map(function(d,i){return'<article class="answer '+(d.ok?'':'bad')+'"><b>'+(d.ok?'✓ Correct':'✕ Incorrect')+' · Question '+(i+1)+'</b><h3>'+esc(d.t)+'</h3><p><strong>Your answer:</strong> '+esc(d.sel)+'</p>'+(d.ok?'':'<p><strong>Correct answer:</strong> '+esc(d.right)+'</p>')+'<p>'+esc(d.e)+'</p></article>'}).join('')+'</section></section>';scrollTo(0,0)}function history(){app.innerHTML='<div class="head"><div><p class="ey">Training records</p><h1>Attempt history</h1><p>Saved on this device when browser storage is available.</p></div></div><section class="hist">'+(attempts.length?attempts.map(function(a){return'<article class="item"><div><h3>'+esc(a.title)+'</h3><p>'+new Date(a.time).toLocaleString()+' · '+a.correct+' correct / '+a.incorrect+' incorrect</p><div class="actions"><button class="btn" data-review="'+a.id+'">Review</button><button class="btn" data-retry="'+a.sid+'">Run again</button></div></div><div class="score">'+a.score+'%</div></article>'}).join(''):'<div class="panel empty"><h2>No attempts yet</h2><p>Complete a scenario first.</p></div>')+'</section>'}function summary(){var total=attempts.length,avg=total?Math.round(attempts.reduce(function(s,a){return s+a.score},0)/total):0,pass=attempts.filter(function(a){return a.score>=75}).length;app.innerHTML='<p class="ey">Training summary</p><h1>Performance overview</h1><section class="grid"><div class="panel"><h2>'+total+'</h2><p>Total attempts</p></div><div class="panel"><h2>'+avg+'%</h2><p>Average score</p></div><div class="panel"><h2>'+pass+'</h2><p>Passed at 75% or higher</p></div></section>'}document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.view){nav(b.dataset.view);return}if(b.dataset.start){start(b.dataset.start);return}if(b.dataset.q!==undefined){answers[Number(b.dataset.q)]=Number(b.dataset.o);scenario();return}if(b.id==="submit"){submit();return}if(b.dataset.retry){start(b.dataset.retry);return}if(b.dataset.review){last=attempts.filter(function(a){return a.id===b.dataset.review})[0];if(last)result()}});library()})();
</script></body></html>
